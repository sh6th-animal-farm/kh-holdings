name: Java CI/CD with Gradle

on:
  push:
    branches: ["develop", "feat/cicd"] # main 브랜치와 feat/cicd에 push될 때 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 1. Gradle 빌드 (테스트 포함)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew clean build -x test # 테스트 제외 시 -x test 추가

      # 2. Docker 이미지 빌드 및 Push (Docker Hub 기준)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build --no-cache -t ${{ secrets.DOCKERHUB_USERNAME }}/kh-holdings:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/kh-holdings:latest

  # 3. 서버 배포 (SSH 접속 후 Docker 실행)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # EC2
#      - name: Deploy to Server
#        uses: appleboy/ssh-action@master
#        with:
#          host: ${{ secrets.SERVER_HOST }}
#          username: ${{ secrets.SERVER_USER }}
#          key: ${{ secrets.SERVER_KEY }}
#          script: |
#            cd /home/${{ secrets.USERNAME }}/kh-holdings
#            docker compose pull
#            docker compose down
#            docker compose up -d
#            docker image prune -f

      # Minsjes
      - name: Deploy to Minsjes Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.MINSJES_SERVER_HOST }}
          username: ${{ secrets.MINSJES_SERVER_USER }}
          password: ${{ secrets.MINSJES_SERVER_PASSWORD }}
          port: ${{ secrets.MINSJES_SERVER_PORT }}
          script: |
            cd /home/student/kh-holdings
            docker compose pull
            docker compose down
            docker compose up -d
            docker image prune -f
